# Weekly dependency updates (docs/10 §1 "Vulnerable dependencies"). Minor and patch bumps come
# as one grouped PR per ecosystem; majors stay separate so each gets its own review.
# Security fixes are raised as soon as GitHub publishes an advisory, outside this schedule.
version: 2
updates:
  - package-ecosystem: npm # reads pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Colombo
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Colombo
    groups:
      actions:
        patterns: ["*"]
