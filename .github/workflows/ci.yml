name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm } # same major as Vercel (Node 24.x)
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:int
      - run: pnpm audit --prod --audit-level high
      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "true"

  # End-to-end (docs/11): the production build against a throwaway in-memory database with
  # throwaway secrets — customer → seller → admin (TOTP) order flow, phone layout, axe checks.
  # Runs here rather than on Vercel previews until the Preview environment has its variables.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MONGODB_URI: mongodb://127.0.0.1:27027/teleshop?replicaSet=rs0
      MONGODB_DB: teleshop
      SKIP_ENV_VALIDATION: "true"
      AUTH_URL: http://localhost:3100
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      E2E_BASE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Throwaway secrets
        run: |
          pw="E2e-$(openssl rand -hex 12)"
          echo "::add-mask::$pw"
          {
            echo "AUTH_SECRET=$(openssl rand -base64 32)"
            echo "TOTP_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "SEED_PASSWORD=$pw"
            echo "E2E_PASSWORD=$pw"
          } >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the database
        run: |
          pnpm db:memory > db.log 2>&1 &
          for i in $(seq 1 90); do grep -q "ready" db.log && break; sleep 2; done
          grep -q "ready" db.log || { cat db.log; exit 1; }
      - run: pnpm db:seed --force
      - run: pnpm build
      - name: Start the app
        run: |
          pnpm exec next start --port 3100 > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3100/ && break; sleep 2; done
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            app.log
          retention-days: 7

  # Production database migrations (docs/12 §3) — main only, after the checks pass.
  migrate:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Without the secret the job is skipped with a visible warning instead of failing the run;
      # migrations can then be applied from a laptop with `pnpm db:migrate`.
      - name: Check the migrator secret
        id: secret
        env:
          MIGRATOR_MONGODB_URI: ${{ secrets.MIGRATOR_MONGODB_URI }}
        run: |
          if [ -z "$MIGRATOR_MONGODB_URI" ]; then
            echo "::warning::Migrations skipped — MIGRATOR_MONGODB_URI is not set (Settings → Environments → production → Environment secrets). Run 'pnpm db:migrate' locally or add the secret (docs/12 §3)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secret.outputs.run == 'true'
        uses: actions/checkout@v5
      - if: steps.secret.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.secret.outputs.run == 'true'
        uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - if: steps.secret.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.secret.outputs.run == 'true'
        run: pnpm db:migrate && pnpm db:indexes
        env:
          MONGODB_URI: ${{ secrets.MIGRATOR_MONGODB_URI }}
          MONGODB_DB: teleshop
